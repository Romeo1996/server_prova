[project]
name = "fastapi-hello-world"
version = "1.0.0"
description = "FastAPI server con endpoint hello world"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.uv]
python-version = "3.11"
