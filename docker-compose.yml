version: '3.8'

services:
  fastapi-server:
    build: .
    image: adk-server:latest
    container_name: fastapi-server
    ports:
      - "8086:8086"
    env_file: .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8086

  adk-web:
    image: adk-server:latest
    container_name: adk-web
    ports:
      - "3000:3000"
    env_file: .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    working_dir: /app/src/agents
    command: uv run adk web --host 0.0.0.0 --port 3000
    depends_on:
      - fastapi-server
