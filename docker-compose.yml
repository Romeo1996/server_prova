version: '3.8'

services:
  fastapi-server:
    build: .

    container_name: fastapi-server

    ports:
      - "8086:8086"

    environment:
      - PYTHONUNBUFFERED=1

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8086/health && echo '🟢 OK' || (echo '🔴 FAILED HEALTHCHECK' && exit 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s